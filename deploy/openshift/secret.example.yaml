# EXAMPLE ONLY — do not `oc apply -f` this file as-is (the placeholder value is not a secret).
#
# The real way to create this Secret is the one-liner below, which never writes the token to a file
# or shell history in plaintext form on disk:
#
#   oc create secret generic llm-wiki-mcp-token \
#     --from-literal=token="$(openssl rand -hex 32)"
#
# deployment.yaml reads this Secret's `token` key into the WIKIKB_API_TOKEN env var. Rotate by
# re-running the command above with `oc create ... --dry-run=client -o yaml | oc replace -f -`
# (or `oc delete secret llm-wiki-mcp-token` first) and restarting the Deployment so the new value is
# picked up (env vars are read at process start, not live-reloaded — `oc rollout restart
# deployment/llm-wiki-mcp`).
apiVersion: v1
kind: Secret
metadata:
  name: llm-wiki-mcp-token
type: Opaque
stringData:
  token: "REPLACE_WITH_A_GENERATED_TOKEN_e_g_openssl_rand_hex_32"
